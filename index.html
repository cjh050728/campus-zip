<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캠퍼스.zip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}body{margin:0}img{max-width:100%}
/* 레이아웃: 흰 바탕 + 한 손 조작 카드. 홈은 메뉴 타일 화면, 나머지 탭은 목록 화면. 구역은 999번 노선도처럼 정류장 모양으로 고른다. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#191F28; --muted:#6B7684; --faint:#8B95A1; --line:#E9ECEF;
  --accent:#7A1A1E; --accent-soft:#F6EAEA; --accent-ink:#6E1519;
  --sun:#FFF1C2; --sun-ink:#8A5A00; --danger:#D9534F;
  --tile-food:#F6EAEA; --tile-food-ink:#7A1A1E; --tile-spot:#E8F3FF; --tile-spot-ink:#1C7ED6;
  --tile-tip:#FFF6D6; --tile-tip-ink:#C88A00; --tile-save:#F1EDFF; --tile-save-ink:#7048E8;
  --shadow:0 1px 2px rgba(25,31,40,.04),0 4px 16px rgba(25,31,40,.05);
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --surface:#1A1D21; --ink:#ECEEF1; --muted:#9AA3AE; --faint:#7A838E; --line:#2A2E34;
  --accent:#D9777A; --accent-soft:#3A1B1C; --accent-ink:#F2AFB0;
  --sun:#3A3016; --sun-ink:#F5C84B; --danger:#F07C78;
  --tile-food:#3A1B1C; --tile-food-ink:#F2AFB0; --tile-spot:#172839; --tile-spot-ink:#6CB2F5;
  --tile-tip:#352D14; --tile-tip-ink:#F5C84B; --tile-save:#262040; --tile-save-ink:#A992FF;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#1A1D21; --ink:#ECEEF1; --muted:#9AA3AE; --faint:#7A838E; --line:#2A2E34;
  --accent:#D9777A; --accent-soft:#3A1B1C; --accent-ink:#F2AFB0;
  --sun:#3A3016; --sun-ink:#F5C84B; --danger:#F07C78;
  --tile-food:#3A1B1C; --tile-food-ink:#F2AFB0; --tile-spot:#172839; --tile-spot-ink:#6CB2F5;
  --tile-tip:#352D14; --tile-tip-ink:#F5C84B; --tile-save:#262040; --tile-save-ink:#A992FF;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* 상단 바 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap}
.brand h1 b{color:var(--accent)}
.brand span{font-size:12px;color:var(--faint)}
.brand-r{display:flex;align-items:center;gap:4px}
#theme{color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:12px 0;outline:none}
.search input::placeholder{color:var(--faint)}
.search button{border:0;background:none;color:var(--faint);padding:4px}

/* 공통 */
h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sec{margin-top:24px;display:grid;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.more{border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:500;padding:4px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.filters .chips,.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.label{font-size:12.5px;color:var(--faint);font-weight:500}
.filters{display:grid;gap:12px;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.frow{display:grid;gap:6px}
.count{color:var(--faint);font-size:13px;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:32px 12px;background:var(--surface);border-radius:var(--r);line-height:1.6}

/* 노선도 구역 */
.route{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:2px}
.route::-webkit-scrollbar{display:none}
.route::before{content:"";position:absolute;left:18px;right:18px;top:11px;height:2px;background:var(--line);z-index:0}
.stop{position:relative;z-index:1;flex:1 0 auto;display:grid;justify-items:center;gap:5px;border:0;background:none;padding:0 6px;font-size:12.5px;color:var(--faint);font-weight:500}
.stop i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:block;margin-top:4px}
.stop[aria-pressed="true"]{color:var(--accent-ink)}
.stop[aria-pressed="true"] i{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* 카드 */
.list{display:grid;gap:8px}
.card{background:var(--surface);border-radius:var(--r);padding:14px 10px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;box-shadow:var(--shadow)}
.card .main{min-width:0;border:0;background:none;text-align:left;padding:0;display:grid;gap:5px}
.card .name{font-weight:600;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.card .desc{font-size:13.5px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.reset{border:0;background:none;color:var(--accent-ink);font-weight:600;font-size:13px;padding:4px 0;justify-self:start}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--faint);align-items:center}
.price{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.badge{font-size:12px;font-weight:500;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--muted)}
.badge.solo{background:var(--accent-soft);color:var(--accent-ink)}
.badge.no{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.votes{font-variant-numeric:tabular-nums}
.side{display:flex;gap:2px;align-items:center}
.icon-btn{border:0;background:none;padding:6px;color:var(--faint);border-radius:10px}
.icon-btn[aria-pressed="true"]{color:var(--tile-save-ink)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}
.map-btn{font-size:12.5px;font-weight:600;text-decoration:none;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:6px 10px;white-space:nowrap}

/* 홈 */
.hello{margin-top:14px;display:grid;gap:4px}
.hello p{margin:0;color:var(--muted);font-size:14px}
.hello h2{font-size:24px;line-height:1.3}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:0;border-radius:20px;padding:16px;text-align:left;display:grid;gap:14px;min-height:118px;align-content:space-between;background:var(--surface);box-shadow:var(--shadow)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tile b{font-size:17px;font-weight:600;display:block}
.tile small{color:var(--faint);font-size:12.5px;font-weight:500}
.tile.food .ic{background:var(--tile-food);color:var(--tile-food-ink)}
.tile.spot .ic{background:var(--tile-spot);color:var(--tile-spot-ink)}
.tile.tip .ic{background:var(--tile-tip);color:var(--tile-tip-ink)}
.tile.save .ic{background:var(--tile-save);color:var(--tile-save-ink)}
.pick{background:var(--surface);border-radius:20px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.pick-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pick-res{background:var(--bg);border-radius:14px;padding:14px;display:grid;gap:6px}
.pick-res .t-name{font-size:21px;font-weight:700;line-height:1.3}
.pick-res .t-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--faint)}
.t-act{display:flex;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:14.5px;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--surface)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.t-act .btn.primary{flex:1}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:0;background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}

/* 꿀팁 */
.tip{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tip summary{list-style:none;cursor:pointer;padding:14px 10px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 8px}
.tip summary::-webkit-details-marker{display:none}
.tip .kind{font-size:12px;font-weight:600;color:var(--accent-ink)}
.tip .tt{font-weight:600;font-size:16px;line-height:1.4}
.tip .ss{font-size:13.5px;color:var(--muted);grid-column:1/-1;padding-right:6px}
.tip .body{padding:0 16px 16px;display:grid;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.tip .body p{margin:0;white-space:pre-line;overflow-wrap:anywhere;line-height:1.65}
.tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.tip dt{color:var(--faint)} .tip dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tip .links{display:flex;flex-wrap:wrap;gap:6px}

/* 상세 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;max-height:85%;overflow:auto;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;display:grid;gap:14px}
.sheet h3{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.sheet dt{color:var(--faint)} .sheet dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--faint);padding:6px 0}
nav.tabs button[aria-current="page"]{color:var(--ink)}
.foot{margin-top:32px;font-size:12px;color:var(--faint);display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.pick-res{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
  .tile,.card,.pill{transition:transform .12s}.tile:active,.card:active,.pill:active{transform:scale(.98)}}
</style>
</head>

function foodList(){
  const f=state.food;
  let L=PLACES.filter(p=>p.c==="맛집");
  if(f.zone!=="all") L=L.filter(p=>p.z===f.zone);
  if(f.kind&&f.kind!=="all") L=L.filter(p=>p.k===f.kind);
  if(f.solo) L=L.filter(p=>p.h==="O");
  if(f.max) L=L.filter(p=>typeof p.p==="number"&&p.p<=f.max);
  return sortPlaces(L,f.sort);
}
function sortPlaces(L,s){
  const c=[...L];
  if(s==="price") c.sort((a,b)=>(typeof a.p==="number"?a.p:1e9)-(typeof b.p==="number"?b.p:1e9)||b.r-a.r);
  else if(s==="recent") c.sort((a,b)=>(has(b.d)?b.d:"").localeCompare(has(a.d)?a.d:"")||b.r-a.r);
  else c.sort((a,b)=>b.r-a.r);
  return c;
}

function zoneRoute(cur,key,withAll){
  const items=(withAll?[["all","전체"]]:[]).concat(ZONES.map(z=>[z,ZONE_SHORT[z]]));
  return `<div class="route" role="group" aria-label="구역">${items.map(([v,l])=>`<button class="stop" data-set="${key}" data-val="${esc(v)}" aria-pressed="${cur===v}"><i></i>${l}</button>`).join("")}</div>`;
}
const chip=(key,val,label,cur)=>`<button class="chip" data-set="${key}" data-val="${esc(val)}" aria-pressed="${String(cur)===String(val)}">${label}</button>`;

function pickOne(){
  const k=state.pick;
  let L=PLACES.filter(p=>p.c==="맛집"&&p.z===k.zone);
  if(k.solo) L=L.filter(p=>p.h==="O");
  if(k.max) L=L.filter(p=>typeof p.p==="number"&&p.p<=k.max);
  if(!L.length){k.cur=null;return}
  let next;
  do{ next=L[Math.floor(Math.random()*L.length)]; }while(L.length>1&&k.cur&&next.id===k.cur);
  k.cur=next.id;
}

function closeSheet(){document.querySelectorAll(".sheet,.sheet-bg").forEach(e=>e.remove())}

document.addEventListener("click",e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){ const txt=cp.dataset.copy, done=()=>{cp.textContent="복사했어요"; setTimeout(()=>{cp.textContent="주소 복사"},1500)};
    try{ navigator.clipboard.writeText(txt).then(done,()=>{cp.textContent=txt}); }catch(err){ cp.textContent=txt; } return; }
  const t=e.target.closest("[data-save],[data-open],[data-set],[data-go],[data-search],[data-act],[data-close],[data-tab],[data-reset]");
  if(!t) return;
  if(t.dataset.save){ e.preventDefault(); toggleSave(t.dataset.save); if(document.querySelector(".sheet")) openSheet(t.dataset.save); return; }
  if(t.dataset.close){ closeSheet(); return; }
  if(t.dataset.reset){ if(t.dataset.reset==="food"){Object.assign(state.food,FOOD_DEFAULT);store.set("czip-food",state.food)} else Object.assign(state.spot,SPOT_DEFAULT); render(); return; }
  if(t.dataset.open){ openSheet(t.dataset.open); return; }
  if(t.dataset.act==="reroll"){ pickOne(); render(); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.q=""; $q.value=""; render(); window.scrollTo(0,0); return; }
  if(t.dataset.search){ state.q=t.dataset.search; $q.value=state.q; render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){
    state.tab=t.dataset.go; state.q=""; $q.value="";
    if(t.dataset.preset==="solo10k") Object.assign(state.food,{zone:"대학로",solo:true,max:10000,sort:"votes"});
    if(t.dataset.kind) state.tip.kind=t.dataset.kind;
    if(t.dataset.tag) Object.assign(state.spot,SPOT_DEFAULT,{tag:t.dataset.tag});
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.set){
    const [grp,key]=t.dataset.set.split("."), v=t.dataset.val;
    const obj=grp==="pick"?state.pick:state[grp];
    if(v==="toggle") obj[key]=!obj[key];
    else obj[key]=/^\d+$/.test(v)?Number(v):v;
    if(grp==="pick") pickOne();
    if(grp==="food") store.set("czip-food",state.food);
    render();
  }
});

document.getElementById("foot").innerHTML=`<span>장소 ${PLACES.length}곳 · 꿀팁 ${TIPS.length}개 · 국립한국교통대 학생 제출물을 정리한 정보예요.</span>
  <span>가격·영업시간·버스 시간은 바뀔 수 있어요. 마지막 정리: ${esc(DATA.updated)}</span>
  ${isUrl(REPORT_URL)?`<a class="map-btn" style="justify-self:start" href="${esc(REPORT_URL)}" target="_blank" rel="noopener">새 장소 제보 · 정보 수정 요청</a>`:""}`;
// 다크 모드 버튼: 누르면 밝게/어둡게 바뀌고, 이 기기에 기억됨
const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const $theme=document.getElementById("theme");
function isDark(){const t=document.documentElement.dataset.theme; return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function paintTheme(){const d=isDark(); $theme.innerHTML=d?SUN:MOON; $theme.setAttribute("aria-label",d?"밝은 화면으로 바꾸기":"다크 모드로 바꾸기")}
const savedTheme=store.get("czip-theme",null); if(savedTheme) document.documentElement.dataset.theme=savedTheme;
$theme.addEventListener("click",()=>{const next=isDark()?"light":"dark"; document.documentElement.dataset.theme=next; store.set("czip-theme",next); paintTheme()});
paintTheme();
render();
</script>

</body>
</html>
